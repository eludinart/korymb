# Hermes Agent + WebUI — référence VPS (/docker/hermes-agent-aoxw/)
# WebUI partage ./data avec l'agent et appelle http://hermes-agent:4860 sur le réseau Docker.

services:
  docker-socket-proxy:
    image: tecnativa/docker-socket-proxy@sha256:9e4b9e7517a6b660f2cc903a19b257b1852d5b3344794e3ea334ff00ae677ac2
    restart: unless-stopped
    # Only Hermes needs Docker for execute_code. Keep the real socket off the agent.
    environment:
      CONTAINERS: 1
      IMAGES: 1
      NETWORKS: 1
      INFO: 1
      VERSION: 1
      EVENTS: 1
      POST: 1
      EXEC: 1
      BUILD: 0
      COMMIT: 0
      CONFIGS: 0
      DISTRIBUTION: 0
      NODES: 0
      PLUGINS: 0
      SECRETS: 0
      SERVICES: 0
      SESSION: 0
      SWARM: 0
      SYSTEM: 0
      TASKS: 0
      VOLUMES: 0
      AUTH: 0
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    networks:
      - default

  hermes-agent:
    image: ghcr.io/hostinger/hvps-hermes-agent@sha256:8bf68cad92c236d6ed0760c1cc268449aad781922277c7d7c994b40ba16a9fd6
    restart: unless-stopped
    # Remote model: 1.5g is enough for the Python agent and leaves RAM for
    # Coolify builds on the 8 GB host. memswap_limit = mem_limit so the cap
    # is not doubled by the 4 GB swap file. One CPU so a tool loop cannot
    # saturate the box during a build.
    mem_limit: 1536m
    memswap_limit: 1536m
    cpus: "1.0"
    group_add:
      - "988"
    ports:
      - "4860"
    labels:
      - traefik.enable=true
      - traefik.docker.network=coolify
      - traefik.http.routers.${COMPOSE_PROJECT_NAME}.rule=Host(`hermes.eludein.art`) || Host(`${COMPOSE_PROJECT_NAME}.${TRAEFIK_HOST}`)
      - traefik.http.routers.${COMPOSE_PROJECT_NAME}.entrypoints=https
      - traefik.http.routers.${COMPOSE_PROJECT_NAME}.tls.certresolver=letsencrypt
      - traefik.http.services.${COMPOSE_PROJECT_NAME}.loadbalancer.server.port=4860
    env_file:
      - .env
    environment:
      DOCKER_HOST: tcp://docker-socket-proxy:2375
    entrypoint: [ /bin/bash, /init-docker-access.sh ]
    volumes:
      - ./data:/opt/data
      - ./init-docker-access.sh:/init-docker-access.sh:ro
    depends_on:
      - docker-socket-proxy
    networks:
      - coolify
      - default

  hermes-webui:
    image: hermes-webui-local@sha256:5a50cd66bba5d92a309fd30b0598de7b565784293fdb70eab637a3d6210c9168
    restart: unless-stopped
    # Node UI. 768m covers the ~350m steady state and stops a leak
    # from eating the 8 GB host. memswap_limit matches mem_limit.
    mem_limit: 768m
    memswap_limit: 768m
    cpus: "0.5"
    entrypoint:
      - /bin/bash
      - -c
      - |
        rm -rf /workspace 2>/dev/null || true
        ln -sf /opt/data/livrables /workspace
        bash /opt/hermes-webui-patches/apply-patches.sh
        exec /hermeswebui_init.bash
    ports:
      # Bind loopback only — Traefik publishes HTTPS; do not expose :3001 on the public NIC.
      - "127.0.0.1:3001:8787"
    labels:
      - traefik.enable=true
      - traefik.docker.network=coolify
      - traefik.http.routers.${COMPOSE_PROJECT_NAME}-webui.rule=Host(`hermeswebui.eludein.art`)
      - traefik.http.routers.${COMPOSE_PROJECT_NAME}-webui.entrypoints=https
      - traefik.http.routers.${COMPOSE_PROJECT_NAME}-webui.tls.certresolver=letsencrypt
      - traefik.http.services.${COMPOSE_PROJECT_NAME}-webui.loadbalancer.server.port=8787
      - traefik.http.routers.${COMPOSE_PROJECT_NAME}-webui-http.rule=Host(`hermeswebui.eludein.art`)
      - traefik.http.routers.${COMPOSE_PROJECT_NAME}-webui-http.entrypoints=http
      - traefik.http.routers.${COMPOSE_PROJECT_NAME}-webui-http.middlewares=redirect-to-https
    env_file:
      - .env
    environment:
      HERMES_WEBUI_STATE_DIR: /opt/data/hermes-webui-state
      HERMES_HOME: /opt/data
      HERMES_WEBUI_AGENT_DIR: /opt/hermes
      HERMES_WEBUI_DEFAULT_WORKSPACE: /opt/data/livrables
      HERMES_AGENT_URL: http://hermes-agent:4860
      HERMES_WEBUI_PASSWORD: ${ADMIN_PASSWORD}
      NODE_ENV: production
    volumes:
      - ./data:/opt/data
      # Source agent (module Python `agent`) — requis pour /api/skills
      - ./hermes-agent-src:/opt/hermes:ro
      - ./hermes-webui-patches:/opt/hermes-webui-patches:ro
    depends_on:
      - hermes-agent
    networks:
      - coolify
      - default

networks:
  coolify:
    external: true
